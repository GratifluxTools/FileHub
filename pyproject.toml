[project]
name = "file-hub"
version = "0.1.0"
description = "ファイルの場所・タグ・リンク・メモを管理し、すばやく検索できる Flet 製のファイル管理アプリ"
requires-python = ">=3.10"
dependencies = [
  "flet==0.28.3",
  "Pillow>=10.0",
  "mutagen>=1.47",
  "send2trash>=1.8",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "py7zr>=0.21",
  "rarfile>=4.1",
  "pillow-heif>=0.16",
]

[tool.flet]
org = "dev.filehub"
product = "File Hub"
company = "Personal"
copyright = "Copyright 2026"
