name: Build

# 手動実行、または Release が公開された時のみ動く
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依存関係とテスト
        run: |
          pip install -r requirements.txt pytest
          python -m pytest tests -q

  build:
    needs: test
    strategy:
      fail-fast: false
      # 6 つの組み合わせ（版 × 環境）をすべて明示する。
      # matrix のキーを別々に書いて include で足すと、組み合わせが正しく増えないため。
      matrix:
        include:
          - { edition: single,   os: windows-2022,     target: windows, arch: x64,   platform: windows-x64 }
          - { edition: single,   os: ubuntu-latest,    target: linux,   arch: x64,   platform: linux-x64 }
          - { edition: single,   os: ubuntu-24.04-arm, target: linux,   arch: arm64, platform: linux-arm64 }
          - { edition: portable, os: windows-2022,     target: windows, arch: x64,   platform: windows-x64 }
          - { edition: portable, os: ubuntu-latest,    target: linux,   arch: x64,   platform: linux-x64 }
          - { edition: portable, os: ubuntu-24.04-arm, target: linux,   arch: arm64, platform: linux-arm64 }
    name: build (${{ matrix.edition }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      # Windows の既定コードページ(cp1252)では記号出力で落ちるため UTF-8 を強制
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux 依存パッケージ
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Flutter（x64）
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # flet build は ~/flutter/<version> に Flutter を入れるが、公式の Linux 配布物は x64 のみで
      # Dart SDK が x64 になってしまう。そのため arm64 では git から同じバージョンを取得して先に置く。
      - name: Flutter（arm64・git から取得、flet と同じバージョン）
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          FLUTTER_VERSION=3.29.2
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter/$FLUTTER_VERSION"
          echo "$HOME/flutter/$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/$FLUTTER_VERSION/bin/flutter" --version
          # sky_engine など Linux 向けエンジンのキャッシュを先に取得する（無いと flet のパッケージ解決で失敗する）
          "$HOME/flutter/$FLUTTER_VERSION/bin/flutter" precache --linux

      - name: 依存関係のインストール
        run: |
          pip install "flet[cli]==0.28.3"
          pip install -r requirements.txt

      - name: 版を設定（ポータブル版のみ書き換え）
        if: matrix.edition == 'portable'
        shell: bash
        run: |
          sed -i 's/^EDITION = .*/EDITION = "portable"/' edition.py
          grep '^EDITION' edition.py

      - name: バージョンを埋め込む（Release 時はタグから）
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "__version__ = \"$VERSION\"" > app_version.py
          sed -i -E "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          cat app_version.py

      - name: ビルド
        run: flet build ${{ matrix.target }}

      - name: ポータブル版に説明書を同梱
        if: matrix.edition == 'portable'
        shell: bash
        run: |
          DIR=build/${{ matrix.target }}
          cp README.md "$DIR/README-FileHub.md"
          printf 'File Hub (portable)\r\n' > "$DIR/PORTABLE-READ-ME-FIRST.txt"
          echo "This folder keeps its own data in the 'data' folder. Keep it writable and move the whole folder together." >> "$DIR/PORTABLE-READ-ME-FIRST.txt"

      - name: 名前を決める
        id: names
        shell: bash
        run: echo "artifact=FileHub-${{ matrix.edition }}-${{ matrix.platform }}" >> "$GITHUB_OUTPUT"

      - name: パッケージ化（Windows）
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "build/windows/*" -DestinationPath "${{ steps.names.outputs.artifact }}.zip"

      - name: パッケージ化（Linux）
        if: matrix.target == 'linux'
        run: cd build/linux && zip -r "$GITHUB_WORKSPACE/${{ steps.names.outputs.artifact }}.zip" .

      - name: Actions の成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: ${{ steps.names.outputs.artifact }}.zip

      - name: Release に添付（Release 公開時のみ）
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.names.outputs.artifact }}.zip
